name: Validate AI engineering assets
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Check installed package outside checkout
        working-directory: /tmp
        run: |
          ai-engineering --version
          ai-engineering context --project .
          ai-engineering skill project-build
          ai-engineering setup --user --home "$RUNNER_TEMP/ai-engineering-home" --dry-run
