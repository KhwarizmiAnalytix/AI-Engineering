[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-enegennr"
version = "0.2.0"
description = "Package-owned engineering rules and skills with user-level Claude Code and Cursor integrations."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "KhwarizmiAnalytix" }]
keywords = ["ai", "claude", "cursor", "rules", "skills", "cpp"]

[project.urls]
Source = "https://github.com/KhwarizmiAnalytix/AI-Engineering"
Issues = "https://github.com/KhwarizmiAnalytix/AI-Engineering/issues"

[project.scripts]
ai-engineering = "ai_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_engineering = [
    "rules/*.md",
    "skills/*/SKILL.md",
    "profiles/*.md",
    "profiles/*.json",
]
